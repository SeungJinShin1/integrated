<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
  // 온라인이면 즉시 서비스로 이동한다. 심사위원은 이 화면을 보지 않고
  // 더블클릭 → 곧바로 프로그램 실행 경험을 얻는다.
  // location.replace: 뒤로가기 시 런처로 되돌아와 다시 이동하는 루프를 방지.
  // 오프라인이면 이동하지 않는다 — 강행하면 브라우저 오류 화면으로 넘어가
  // 아래 안내가 사라지기 때문.
  if (navigator.onLine !== false) {
    location.replace("https://www.inedu.site/");
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히든피스: 우리 반 보물찾기</title>
<style>
  /* 이 본문은 오프라인이거나 자바스크립트가 꺼진 경우에만 보인다.
     외부 리소스 0개(시스템 폰트만 사용) — 오프라인에서도 레이아웃 유지 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 55%, #312e81 100%);
    min-height: 100vh;
    color: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    text-align: center;
  }
  .wrap { max-width: 640px; width: 100%; }
  .contest { color: #c7d2fe; font-size: 14px; font-weight: 700; letter-spacing: 2px; margin-bottom: 14px; }
  h1 {
    font-size: 38px; font-weight: 900; margin-bottom: 10px;
    background: linear-gradient(135deg, #fde68a 0%, #fbbf24 50%, #f59e0b 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .target { color: #e2e8f0; font-size: 16px; font-weight: 700; margin-bottom: 34px; }
  .target span {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px; padding: 6px 18px;
  }
  .notice {
    background: rgba(252, 165, 165, 0.08); border: 1px solid rgba(252, 165, 165, 0.35);
    border-radius: 16px; padding: 22px 24px; margin-bottom: 22px;
    font-size: 15.5px; line-height: 1.8; color: #fecaca; font-weight: 700;
  }
  .go {
    display: inline-block; text-decoration: none;
    font-size: 20px; font-weight: 900; color: #1e1b4b;
    background: linear-gradient(135deg, #fde68a, #fbbf24);
    border-radius: 16px; padding: 16px 46px;
    box-shadow: 0 12px 30px rgba(251, 191, 36, 0.35);
  }
  .url { margin-top: 14px; font-size: 13.5px; color: #94a3b8; }
  .url code {
    font-family: Consolas, 'Courier New', monospace;
    background: rgba(0,0,0,0.35); border-radius: 6px; padding: 2px 8px; color: #a5f3fc;
  }
  footer {
    font-size: 12px; color: #64748b; line-height: 1.8;
    border-top: 1px solid rgba(255,255,255,0.1); padding-top: 14px; margin-top: 30px;
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="contest">제20회 디지털교육연구대회 출품작</p>
  <h1>히든피스: 우리 반 보물찾기</h1>
  <p class="target"><span>대상: 초등학교 1~6학년</span></p>

  <div class="notice">
    이 프로그램은 웹 서비스로 운영되는 소프트웨어입니다.<br>
    인터넷 연결을 확인한 뒤 이 파일을 다시 열거나,<br>
    아래 버튼(또는 주소)으로 접속해 주세요.
  </div>

  <a class="go" href="https://www.inedu.site/">프로그램 실행하기</a>
  <p class="url">주소창 직접 입력: <code>https://www.inedu.site</code></p>

  <footer>
    심사용 계정 및 사용 절차는 연구보고서의 「소프트웨어 사용 안내」를 참고해 주세요.<br>
    이미지·배경음악: 생성형 AI로 직접 제작 | 음성: Typecast AI 보이스(라이선스 확보) | 폰트: 나눔고딕(OFL)
  </footer>
</div>
</body>
</html>
